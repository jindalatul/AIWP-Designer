services:
  db:
    image: mariadb:11
    container_name: aiwp-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: rootpass
    volumes:
      - aiwp-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6.8-php8.3-apache
    container_name: aiwp-wp
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG', true );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'WP_HOME', 'http://localhost:8090' );
        define( 'WP_SITEURL', 'http://localhost:8090' );
        define( 'DISALLOW_FILE_EDIT', true );
    volumes:
      - aiwp-wp:/var/www/html
      # The plugin is mounted live, so an edit on the Mac is instantly in WordPress.
      - .:/var/www/html/wp-content/plugins/aiwp-designer

volumes:
  aiwp-db:
  aiwp-wp:
